<section id="certificates" class="section reveal">
  <div class="section-label">04 / CERTIFICATES</div>

  <div class="section-content">
    <span class="kicker">CERTIFICATIONS & PROGRAMS</span>
    <h2>Credentials</h2>

    <p class="intro">
      Click a certification card to view the original certificate.
    </p>

    <div class="cert-grid">

      <!-- IBM GEN AI + CLOUD -->
      <button class="cert" type="button"
              data-image="assets/IBM.jpeg"
              aria-label="View IBM Gen AI and Cloud Computing certificate">

        <span class="cert-inner">

          <!-- POSTER -->
          <span class="cert-face cert-front cert-poster">
            <span class="poster-number">01</span>

            <span class="poster-main">
              <strong>AI <i>×</i> CLOUD</strong>
              <span>IBM SKILLSBUILD</span>
            </span>

            <span class="poster-bottom">
              <b>Gen AI & Cloud Computing Internship</b>
              <small>BharatCares · AICTE · IBM SkillsBuild</small>
              <small>22 JUN — 31 JUL 2026 · 6 WEEKS</small>
            </span>

            <span class="poster-line"></span>
          </span>

          <!-- ORIGINAL CERTIFICATE -->
          <span class="cert-face cert-back">
            <img src="assets/IBM.jpeg"
                 alt="IBM SkillsBuild Gen AI and Cloud Computing certificate">
            <span class="certificate-hint">
              CLICK TO VIEW FULL CERTIFICATE ↗
            </span>
          </span>

        </span>
      </button>


      <!-- IBM AGENTIC AI -->
      <button class="cert" type="button"
              data-image="assets/data-analytics-ibm.jpeg"
              aria-label="View IBM Agentic AI certificate">

        <span class="cert-inner">

          <!-- POSTER -->
          <span class="cert-face cert-front cert-poster">
            <span class="poster-number">02</span>

            <span class="poster-main">
              <strong>AI <i>×</i> AGENTS</strong>
              <span>IBM SKILLSBUILD</span>
            </span>

            <span class="poster-bottom">
              <b>From Learner to Builder</b>
              <small>Become an AI Agent Architect</small>
              <small>CSRBOX · 4 WEEK PROGRAM</small>
            </span>

            <span class="poster-line"></span>
          </span>

          <!-- ORIGINAL CERTIFICATE -->
          <span class="cert-face cert-back">
            <img src="assets/data-analytics-ibm.jpeg"
                 alt="IBM SkillsBuild Agentic AI certificate">
            <span class="certificate-hint">
              CLICK TO VIEW FULL CERTIFICATE ↗
            </span>
          </span>

        </span>
      </button>


      <!-- DELOITTE -->
      <button class="cert" type="button"
              data-image="assets/deloitte-certificate.png"
              aria-label="View Deloitte certificate">

        <span class="cert-inner">

          <!-- POSTER -->
          <span class="cert-face cert-front cert-poster">
            <span class="poster-number">03</span>

            <span class="poster-main">
              <strong>DATA <i>×</i> INSIGHT</strong>
              <span>DELOITTE</span>
            </span>

            <span class="poster-bottom">
              <b>Data Analytics Job Simulation</b>
              <small>Data Analysis · Forensic Technology</small>
              <small>DELOITTE × FORAGE</small>
            </span>

            <span class="poster-line"></span>
          </span>

          <!-- ORIGINAL CERTIFICATE -->
          <span class="cert-face cert-back">
            <img src="assets/deloitte-certificate.pdf"
                 alt="Deloitte Data Analytics Job Simulation certificate">
            <span class="certificate-hint">
              CLICK TO VIEW FULL CERTIFICATE ↗
            </span>
          </span>

        </span>
      </button>

    </div>
  </div>
</section>
